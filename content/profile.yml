experience:
  - role: Technical Consultant
    company: Razorpay
    dates: Oct 2025 – Present
    points:
      - Quantified 91,115 failed payouts worth about ₹70L across 46 merchants during a critical payout outage, which drove the P0 declaration and the rollback decision.
      - Built automated SQL reconciliation reports over ~300K monthly transactions across 18 accounts, saving ~20 hours of manual work a month and cutting payout SLA from 40 to 15 minutes.
      - Recovered 39% of dormant virtual accounts (27 of 70) and flagged 33 low-balance merchants by cleaning balance data and running a cohort analysis in pandas.
  - role: Associate Technical Consultant
    company: Razorpay
    dates: Mar 2024 – Sep 2025
    points:
      - Restored auto-refresh and live balances for 4,000+ merchant users by tracing a balance-fetch degradation through service logs and failure patterns.
      - Pinned down the actual exposure of ₹35,498 in a disputed case by reconciling payout records against dashboard transactions in SQL, so it could be settled precisely.
      - Recovered ~₹5L in transaction fees that had gone uncharged by finding a fee-debit gap and fixing the reporting logic so it gets caught in future.

